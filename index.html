<style>
/* 段取り名人 — 方眼紙の工程表。藍の罫線（ダークは青焼き）、レーンごとの付箋の色、完成時刻の大きな数字。
   中央480pxの一列。紙面は角の立った図面、付箋だけ少し傾ける。 */
:root{
  --bg:#EDF2F4; --grid-a:rgba(43,98,158,.07); --grid-b:rgba(43,98,158,.14);
  --paper:#FCFDFD; --paper-2:#F3F7F9; --paper-3:#E6EDF2;
  --ink:#13294B; --ink-2:#3B5072; --ink-3:#5F718C; --ink-inv:#F4F8FC;
  --line:#2D63A6; --line-2:rgba(45,99,166,.4); --line-3:rgba(45,99,166,.17);
  --pri:#173462; --pri-ink:#F4F8FC; --pri-2:#0E2449;
  --red:#CF3A28; --red-wash:rgba(207,58,40,.1); --red-ink:#FFFFFF;
  --ok:#1C7F52; --ok-wash:rgba(28,127,82,.12);
  --k-acc:#E8651F; --k-acc-ink:#B2470F; --s-acc:#E3A400; --s-acc-ink:#7F5C00;
  --acc:var(--k-acc); --acc-ink:var(--k-acc-ink);
  --hatch:rgba(45,99,166,.2);
  --note-ink:#2A2516; --note-ink-2:#5B5338;
  --n-hand:#FFE15A; --n-stove:#FFA08A; --n-rice:#A3E2B6; --n-oven:#FFC56E; --n-micro:#C6BCFF;
  --n-worker:#FFE15A; --n-digger:#FFB56A; --n-truck:#9AD3FF; --n-mixer:#C6BCFF; --n-crane:#FFA3C0; --n-wait:#DAE3EB;
  --sh-1:0 1px 0 rgba(19,41,75,.05),0 10px 20px -16px rgba(19,41,75,.5);
  --sh-note:0 1px 1px rgba(50,40,0,.12),0 9px 12px -9px rgba(50,40,0,.45);
  --scrim:rgba(237,242,244,.94);
  --f-body:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo",system-ui,sans-serif;
  --f-disp:"Dela Gothic One","BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.75,.2,1);
  --bounce:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A2240; --grid-a:rgba(150,200,255,.05); --grid-b:rgba(150,200,255,.11);
    --paper:#0F3158; --paper-2:#0C2A4C; --paper-3:#15406E;
    --ink:#E8F2FF; --ink-2:#B5CAE5; --ink-3:#8DA6C6; --ink-inv:#0A2240;
    --line:#8EC3FF; --line-2:rgba(142,195,255,.42); --line-3:rgba(142,195,255,.15);
    --pri:#DCEBFF; --pri-ink:#0A2240; --pri-2:#BBD7FA;
    --red:#FF7765; --red-wash:rgba(255,119,101,.15); --red-ink:#0A2240;
    --ok:#5FD69D; --ok-wash:rgba(95,214,157,.14);
    --k-acc:#FF8C4E; --k-acc-ink:#FFA270; --s-acc:#FFC83D; --s-acc-ink:#FFD56A;
    --hatch:rgba(142,195,255,.2);
    --n-hand:#EED454; --n-stove:#F09A86; --n-rice:#93D4A7; --n-oven:#F0B865; --n-micro:#B6ACF2;
    --n-worker:#EED454; --n-digger:#F0A964; --n-truck:#8CC6F2; --n-mixer:#B6ACF2; --n-crane:#F097B4; --n-wait:#A9BCD0;
    --sh-1:0 1px 0 rgba(0,0,0,.18),0 12px 24px -16px rgba(0,0,0,.75);
    --sh-note:0 1px 1px rgba(0,0,0,.3),0 10px 14px -9px rgba(0,0,0,.65);
    --scrim:rgba(10,34,64,.94);
  }
}
:root[data-theme="dark"]{
  --bg:#0A2240; --grid-a:rgba(150,200,255,.05); --grid-b:rgba(150,200,255,.11);
  --paper:#0F3158; --paper-2:#0C2A4C; --paper-3:#15406E;
  --ink:#E8F2FF; --ink-2:#B5CAE5; --ink-3:#8DA6C6; --ink-inv:#0A2240;
  --line:#8EC3FF; --line-2:rgba(142,195,255,.42); --line-3:rgba(142,195,255,.15);
  --pri:#DCEBFF; --pri-ink:#0A2240; --pri-2:#BBD7FA;
  --red:#FF7765; --red-wash:rgba(255,119,101,.15); --red-ink:#0A2240;
  --ok:#5FD69D; --ok-wash:rgba(95,214,157,.14);
  --k-acc:#FF8C4E; --k-acc-ink:#FFA270; --s-acc:#FFC83D; --s-acc-ink:#FFD56A;
  --hatch:rgba(142,195,255,.2);
  --n-hand:#EED454; --n-stove:#F09A86; --n-rice:#93D4A7; --n-oven:#F0B865; --n-micro:#B6ACF2;
  --n-worker:#EED454; --n-digger:#F0A964; --n-truck:#8CC6F2; --n-mixer:#B6ACF2; --n-crane:#F097B4; --n-wait:#A9BCD0;
  --sh-1:0 1px 0 rgba(0,0,0,.18),0 12px 24px -16px rgba(0,0,0,.75);
  --sh-note:0 1px 1px rgba(0,0,0,.3),0 10px 14px -9px rgba(0,0,0,.65);
  --scrim:rgba(10,34,64,.94);
}
.t-site{--acc:var(--s-acc);--acc-ink:var(--s-acc-ink)}
.t-kitchen{--acc:var(--k-acc);--acc-ink:var(--k-acc-ink)}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg)}
body{
  margin:0;min-height:100vh;min-height:100dvh;overflow-x:hidden;
  font-family:var(--f-body);font-size:15px;line-height:1.65;color:var(--ink);
  background-color:var(--bg);
  background-image:
    linear-gradient(var(--grid-b) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-b) 1px,transparent 1px),
    linear-gradient(var(--grid-a) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-a) 1px,transparent 1px);
  background-size:40px 40px,40px 40px,8px 8px,8px 8px;
  background-position:-1px -1px;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
body.no-scroll{overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
[hidden]{display:none!important}
.vh{position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip:rect(0 0 0 0)!important;white-space:nowrap!important;margin:-1px!important;padding:0!important;border:0!important}
.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.tnum{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
:focus-visible{outline:2.5px solid var(--line);outline-offset:2px}
a{color:var(--line)}

#app{max-width:480px;margin:0 auto;padding:0 16px calc(32px + env(safe-area-inset-bottom));position:relative}
body[data-view="play"] #app{padding-bottom:calc(98px + env(safe-area-inset-bottom))}
.view{animation:view-in .32s var(--ease) both}
@keyframes view-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- ボタン（製図の判のように角の立った形。押すとずれた影が消える） ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 16px;
  border:1.6px solid var(--ink);border-radius:4px;background:var(--paper);color:var(--ink);
  font-weight:700;font-size:15px;letter-spacing:.02em;line-height:1.3;text-align:center;
  box-shadow:3px 3px 0 var(--line-2);transition:transform .14s var(--ease),box-shadow .14s var(--ease),background-color .2s,color .2s;
}
.btn:hover{background:var(--paper-2)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line-2)}
.btn .i{width:19px;height:19px}
.btn-pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri);box-shadow:3px 3px 0 var(--acc)}
.btn-pri:hover{background:var(--pri-2)}
.btn-pri:active{box-shadow:1px 1px 0 var(--acc)}
.btn-ghost{box-shadow:none;border-style:dashed;border-color:var(--line-2);color:var(--ink-2)}
.btn-ghost:active{box-shadow:none}
.btn-danger{background:var(--red);border-color:var(--red);color:var(--red-ink);box-shadow:3px 3px 0 var(--red-wash)}
.btn-wide{width:100%}
.btn[aria-disabled="true"],.btn:disabled{opacity:.45;pointer-events:none}
.icon-btn{
  display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;flex:none;border-radius:4px;
  border:1.5px solid transparent;background:transparent;color:var(--ink);transition:background-color .2s,border-color .2s,transform .14s;
}
.icon-btn:hover{background:var(--paper-2);border-color:var(--line-3)}
.icon-btn:active{transform:scale(.94)}
.icon-btn .i{width:22px;height:22px}

/* ---------- ホーム ---------- */
.masthead{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 0 10px}
.brand{display:flex;align-items:center;gap:11px;flex:1;min-width:0}
.logo{width:46px;height:46px;flex:none;filter:drop-shadow(2px 2px 0 var(--line-3))}
.logo .lg-bg{fill:var(--pri)}
.logo .lg-fin{stroke:var(--pri-ink)}
.brand-name{margin:0;font-family:var(--f-disp);font-weight:400;font-size:26px;line-height:1.1;letter-spacing:.04em}
.brand-sub{margin:2px 0 0;font-size:12px;color:var(--ink-3);letter-spacing:.06em}
.home-note{display:grid;gap:8px;margin:2px 0 12px}
.hn{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border:1.5px solid var(--line-2);border-radius:4px;background:var(--paper);text-align:left;color:var(--ink)}
.hn .i{color:var(--acc-ink)}
.hn span{flex:1;min-width:0;display:grid}
.hn b{font-size:14px;word-break:keep-all;overflow-wrap:anywhere}.hn small{font-size:12.5px;color:var(--ink-3)}

/* はじめての段取り（黄色い付箋） */
.tut-card{
  position:relative;margin:6px 4px 20px;padding:18px 16px 16px;background:var(--n-hand);color:var(--note-ink);
  border-radius:2px;box-shadow:var(--sh-note);transform:rotate(-.6deg);
  background-image:linear-gradient(rgba(0,0,0,.06) 0 10px,transparent 10px);
  animation:note-in .5s var(--bounce) both;
}
@keyframes note-in{from{opacity:0;transform:translateY(-10px) rotate(-3deg)}to{opacity:1;transform:rotate(-.6deg)}}
.tut-card .eyebrow{color:var(--note-ink-2)}
.tc-h{margin:4px 0 2px;font-family:var(--f-disp);font-weight:400;font-size:21px;line-height:1.3;letter-spacing:.03em}
.tc-h small{font-family:var(--f-body);font-size:12.5px;font-weight:700;margin-left:8px;color:var(--note-ink-2);letter-spacing:0}
.tc-d{margin:0 0 10px;font-size:13.5px;color:var(--note-ink-2)}
.tc-x{position:absolute;top:8px;right:6px;color:var(--note-ink)}
.tc-x:hover{background:rgba(0,0,0,.06);border-color:transparent}
.tut-card .btn-pri{--acc:#2A2516;background:#13294B;border-color:#13294B;color:#F4F8FC;box-shadow:3px 3px 0 rgba(42,37,22,.35)}
.steps{display:flex;gap:6px;margin:0 0 14px;padding:0;list-style:none;counter-reset:s}
.steps li{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;padding:7px 4px 7px;border:1.4px dashed rgba(42,37,22,.38);border-radius:3px;font-size:12px;font-weight:700;line-height:1.3;text-align:center}
.steps li i{display:inline-grid;place-items:center;width:21px;height:21px;flex:none;border-radius:50%;border:1.6px solid currentColor;font-style:normal;font-family:var(--f-num);font-size:11.5px}
.steps li i .i{width:13px;height:13px;stroke-width:3}
.steps li.ok{border-style:solid;background:rgba(255,255,255,.45)}
.steps li.ok i{background:#13294B;border-color:#13294B;color:#FFE15A}
.steps li.now{border-style:solid;border-color:#13294B}
.steps.on-paper li{border-color:var(--line-2);color:var(--ink)}
.steps.on-paper li.ok{background:var(--paper-2)}
.steps.on-paper li.ok i{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.steps.on-paper li.now{border-color:var(--ink)}

.eyebrow{margin:0;font-size:11.5px;font-weight:700;letter-spacing:.14em;color:var(--ink-3)}
/* 今日の段取り（図面の紙。右下に表題欄） */
.today{
  position:relative;margin:4px 0 14px;padding:16px 16px 16px;background:var(--paper);
  border:1.6px solid var(--ink);border-radius:2px;box-shadow:var(--sh-1);overflow:hidden;
}
.today::before{content:"";position:absolute;inset:5px;border:1px solid var(--line-3);pointer-events:none}
.today-deco{position:absolute;right:-6px;top:8px;width:150px;height:74px;opacity:.55;pointer-events:none}
.today-top{position:relative;display:flex;align-items:center;justify-content:flex-start;gap:10px}
.theme-tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 6px;border-radius:999px;background:var(--acc);color:#1B1405;font-size:12.5px;font-weight:700;line-height:1.4}
.theme-tag .i{width:16px;height:16px;stroke-width:2}
.today-title{position:relative;margin:8px 0 2px;font-family:var(--f-disp);font-weight:400;font-size:25px;line-height:1.3;letter-spacing:.03em}
.today-story{position:relative;margin:0 0 12px;font-size:13.5px;color:var(--ink-2)}
.tblock{position:relative;display:grid;grid-template-columns:.8fr 1.5fr 1fr;border:1.4px solid var(--ink);margin:0 0 12px;background:var(--paper)}
.tblock>div{padding:5px 8px 6px;border-right:1px solid var(--line-2);min-width:0}
.tblock>div:nth-child(3){border-right:0}
.tblock .st-row{grid-column:1/-1;border-top:1px solid var(--line-2);border-right:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:38px}
.tblock small{display:block;font-size:10.5px;color:var(--ink-3);letter-spacing:.08em;font-weight:700}
.tblock b{display:block;font-size:15px;line-height:1.35}
.tblock .tnum{font-weight:600}
.tb-no{font-size:22px!important;line-height:1.1!important}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border:1.3px solid var(--line-2);border-radius:999px;font-size:12px;font-weight:700;line-height:1.5;color:var(--ink-2);white-space:nowrap}
.chip.go{border-color:var(--acc);color:var(--acc-ink)}
.chip.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-wash)}
.chip .i{width:14px;height:14px}
.st-text{font-size:13px;color:var(--ink-2)}
.streak{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;margin:0 0 22px;padding:0 2px;font-size:13px;color:var(--ink-2)}
.streak .fire{display:inline-flex;align-items:center;gap:5px;font-weight:700;color:var(--ink)}
.streak .fire .i{color:var(--k-acc)}
.streak .fire.off .i{color:var(--ink-3)}
.streak b{font-family:var(--f-num);font-size:17px}

.sec{margin:0 0 22px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px}
.sec-head h2{margin:0;font-family:var(--f-disp);font-weight:400;font-size:18px;letter-spacing:.06em}
.seg{display:inline-flex;padding:3px;border:1.4px solid var(--ink);border-radius:5px;background:var(--paper);gap:2px}
.seg button{display:inline-flex;align-items:center;gap:5px;min-height:36px;padding:4px 11px;border:0;border-radius:3px;background:transparent;font-size:13.5px;font-weight:700;color:var(--ink-2);transition:background-color .2s,color .2s}
.seg button .i{width:17px;height:17px}
.seg button[aria-checked="true"],.seg button[aria-pressed="true"]{background:var(--pri);color:var(--pri-ink)}
.prac{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pr{
  position:relative;display:grid;justify-items:start;gap:2px;min-height:84px;padding:11px 10px 10px;text-align:left;
  border:1.5px solid var(--ink);border-radius:3px;background:var(--paper);box-shadow:3px 3px 0 var(--line-3);
  transition:transform .16s var(--ease),box-shadow .16s var(--ease),background-color .2s;
}
.pr:hover{transform:translateY(-2px);box-shadow:4px 5px 0 var(--line-3)}
.pr:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line-3)}
.pr .stars{margin-bottom:2px}
.pr b{font-size:15px}
.pr small{font-size:11.5px;color:var(--ink-3);line-height:1.35;word-break:keep-all;overflow-wrap:anywhere}
.pr .badge{position:absolute;top:-8px;right:-6px;padding:1px 7px;border-radius:2px;background:var(--acc);color:#1B1405;font-size:11px;font-weight:700;transform:rotate(3deg);box-shadow:var(--sh-note)}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 8px}
.menu button{
  display:grid;justify-items:center;gap:6px;padding:14px 6px 12px;border:1.5px dashed var(--line-2);border-radius:3px;background:transparent;
  font-size:13.5px;font-weight:700;color:var(--ink);transition:background-color .2s,border-color .2s,transform .16s var(--ease)
}
.menu button:hover{background:var(--paper);border-style:solid;border-color:var(--ink)}
.menu button:active{transform:scale(.97)}
.menu .i{width:26px;height:26px;color:var(--line)}
.foot-note{margin:18px 2px 0;font-size:12px;color:var(--ink-3);text-align:center}

.stars{display:inline-flex;gap:1px;vertical-align:-2px}
.stars svg{width:15px;height:15px}
.stars .on{fill:var(--acc);stroke:var(--ink);stroke-width:1.4}
.stars .off{fill:none;stroke:var(--ink-3);stroke-width:1.4}

/* ---------- 段取り（プレイ） ---------- */
.topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;margin:0 -16px 10px;padding:calc(6px + env(safe-area-inset-top)) 12px 8px 6px;
  background:var(--scrim);border-bottom:1.4px solid var(--line-3);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
.tb-mid{flex:1;min-width:0}
.tb-meta{display:flex;align-items:center;gap:7px;margin:0;font-size:12px;font-weight:700;color:var(--ink-3);white-space:nowrap;overflow:hidden}
.tb-meta .tag{display:inline-flex;align-items:center;gap:3px;color:var(--acc-ink)}
.tb-meta .tag .i{width:14px;height:14px;stroke-width:2}
.tb-title{margin:0;font-family:var(--f-disp);font-weight:400;font-size:18px;line-height:1.3;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.story{margin:0 2px 10px;font-size:13px;color:var(--ink-2)}

.chart-sheet{position:relative;margin:0 0 12px;padding:10px 10px 8px;background:var(--paper);border:1.6px solid var(--ink);border-radius:2px;box-shadow:var(--sh-1)}
.ch-head{display:flex;align-items:flex-end;gap:10px;margin:0 2px 8px;min-height:50px}
.ch-fin{display:flex;align-items:baseline;gap:6px;min-width:0}
.ch-fin small{font-size:11.5px;font-weight:700;letter-spacing:.12em;color:var(--ink-3);align-self:center;writing-mode:horizontal-tb}
.ch-num{font-family:var(--f-num);font-weight:600;font-size:44px;line-height:.95;letter-spacing:-.02em;color:var(--ink);transition:color .3s}
.ch-num.pop{animation:num-pop .55s var(--bounce)}
@keyframes num-pop{0%{transform:scale(1)}35%{transform:scale(1.18)}100%{transform:scale(1)}}
.ch-unit{font-weight:700;font-size:15px;color:var(--ink-2)}
.ch-side{margin-left:auto;display:grid;justify-items:end;gap:3px;font-size:12px;color:var(--ink-3);text-align:right}
.ch-side .gchip{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border:1.3px dashed var(--acc);border-radius:3px;color:var(--acc-ink);font-weight:700}
.ch-side .gchip .i{width:14px;height:14px}
.ch-num.zero{color:var(--ink-3)}
.ch-hint{font-size:11.5px;line-height:1.4;color:var(--ink-3);max-width:12em;word-break:keep-all;overflow-wrap:anywhere}
.chart-sheet.finished .ch-num{color:var(--acc-ink)}
.chart-sheet.finished{cursor:pointer}
.fin-banner.late{animation-delay:.62s}
.confetti.late i{animation-delay:calc(var(--d) + .62s)}
.fin-banner{
  position:absolute;left:50%;top:44%;z-index:6;transform:translate(-50%,-50%) rotate(-4deg);padding:8px 18px 9px;
  background:var(--paper);border:2.5px solid var(--acc);color:var(--acc-ink);border-radius:3px;box-shadow:0 0 0 4px var(--paper),var(--sh-1);
  font-family:var(--f-disp);font-size:26px;letter-spacing:.12em;white-space:nowrap;pointer-events:none;animation:banner-in .55s var(--bounce) both
}
.fin-banner small{display:block;font-family:var(--f-body);font-weight:700;font-size:12px;letter-spacing:.06em;text-align:center;color:var(--ink-2)}
@keyframes banner-in{from{opacity:0;transform:translate(-50%,-50%) rotate(-14deg) scale(1.7)}to{opacity:1;transform:translate(-50%,-50%) rotate(-4deg) scale(1)}}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:5}
.confetti i{position:absolute;width:9px;height:7px;border-radius:1px;background:var(--c);left:var(--x0);top:var(--y0);opacity:0;animation:conf 1.1s var(--ease) var(--d) forwards}
@keyframes conf{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--r))}}

/* 工程表（ガントチャート） */
.gt{display:grid;grid-template-columns:var(--labw,58px) minmax(0,1fr);--rh:36px}
.gt-mini{--rh:28px;--labw:32px}
.gt-labs{display:flex;flex-direction:column;border-right:1.4px solid var(--ink)}
.gt-lab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;height:calc(var(--rh) * var(--k,1));padding:0 3px;border-bottom:1px dashed var(--line-3);transition:height .3s var(--ease);position:relative}
.gt-lab::before{content:"";position:absolute;left:0;top:5px;bottom:5px;width:4px;border-radius:0 2px 2px 0;background:var(--lc)}
.gt-lab .i{width:17px;height:17px;color:var(--ink-2)}
.gt-lab span{font-size:11px;font-weight:700;line-height:1.15;color:var(--ink-2);white-space:nowrap;letter-spacing:-.04em}
.gt-mini .gt-lab{padding-left:6px}
.gt-mini .gt-lab .i{width:16px;height:16px}
.gt-plot{position:relative;min-width:0}
.gt-grid,.gt-marks{position:absolute;inset:0;pointer-events:none}
.gt-grid i{position:absolute;top:0;bottom:0;width:0;border-left:1px solid var(--line-3);transition:left .35s var(--ease)}
.gt-grid i.mj{border-left:1px solid var(--line-2)}
.gt-grid i.mn{border-left:1px dotted var(--line-3)}
.gt-rows{position:relative}
.gt-row{position:relative;height:calc(var(--rh) * var(--k,1));border-bottom:1px dashed var(--line-3);transition:height .3s var(--ease)}
.gt-idle{position:absolute;inset:0}
.gt-idle i{position:absolute;top:3px;bottom:3px;background:repeating-linear-gradient(-45deg,var(--hatch) 0 1.4px,transparent 1.4px 5px);border-radius:1px;transition:left .35s var(--ease),width .35s var(--ease);animation:fade-in .4s ease both}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
.gb{
  position:absolute;height:calc(var(--rh) - 8px);display:flex;align-items:center;gap:3px;padding:0 4px 0 3px;overflow:hidden;
  background:var(--lc);color:var(--note-ink);border:1.2px solid rgba(30,25,10,.55);border-radius:2px;
  box-shadow:0 1px 0 rgba(0,0,0,.08);transition:left .35s var(--ease),width .35s var(--ease),top .3s var(--ease),opacity .3s,box-shadow .3s;
  font-size:11px;font-weight:700;line-height:1.1;white-space:nowrap;z-index:1
}
.gt-mini .gb{height:calc(var(--rh) - 7px);font-size:11px}
.gb .n{display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 3px;flex:none;border-radius:9px;background:rgba(30,25,10,.82);color:#FFF8E0;font-family:var(--f-num);font-size:11px;font-weight:600}
.gt-mini .gb .n{min-width:16px;height:16px}
.gb .t{overflow:hidden;text-overflow:ellipsis;min-width:0}
.gb.sm .t{display:none}
/* 狭い帯（24px 未満）は名前を隠し、番号だけを帯の真ん中に出す（帯より広ければ、はみ出して出す。#0005: 番号が消えてどのカードの帯か分からなかった） */
.gb.xs{overflow:visible;justify-content:center;padding:0}
.gb.xs .t{display:none}
.gb.xs .n{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);min-width:15px;height:15px;padding:0 2px;z-index:2}
.gt-mini .gb.xs .n{min-width:15px;height:15px}
.gb.xs.grow{animation-name:gb-grow-xs}
@keyframes gb-grow-xs{from{clip-path:inset(-8px 100% -8px 0)}to{clip-path:inset(-8px -10px -8px -10px)}}
.gb.wait{background:repeating-linear-gradient(-45deg,rgba(255,255,255,.4) 0 4px,transparent 4px 8px),var(--lc);border-style:dashed}
.gb.grow{animation:gb-grow var(--gd,.45s) var(--ease) both}
.gb.shrink{animation:gb-shrink .28s ease-in both}
@keyframes gb-grow{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes gb-shrink{from{clip-path:inset(0 0 0 0);opacity:1}to{clip-path:inset(0 100% 0 0);opacity:.4}}
.gb.hl{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--red);z-index:3}
.gb.dim{opacity:.38}
.gt-fin{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--acc);transition:left .45s var(--ease);z-index:4}
.gt-best{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--ok);z-index:4}
.gt-guess{position:absolute;top:0;bottom:0;width:0;border-left:1.6px dotted var(--acc-ink);z-index:2}
/* 上の帯: 完成の旗と、予想・最短の名札（工程表の見出しの数字とぶつからないよう、専用の段に置く） */
.gt-strip{position:relative;height:17px}
.gt-tag{position:absolute;bottom:2px;padding:0 3px;font-size:11px;font-weight:700;line-height:1.2;white-space:nowrap;transition:left .45s var(--ease)}
.gt-tag.l{transform:translateX(-100%)}
.gt-tag.tg-best{color:var(--ok)}
.gt-tag.tg-guess{color:var(--acc-ink)}
.gt-flag{position:absolute;bottom:0;height:16px;width:0;border-left:2px solid var(--acc);transition:left .45s var(--ease);z-index:4}
.gt-flag::before{content:"";position:absolute;top:0;left:0;width:13px;height:9px;background:conic-gradient(var(--ink) 25%,var(--paper) 0 50%,var(--ink) 0 75%,var(--paper) 0) 0 0/6.5px 4.5px;border:1px solid var(--ink)}
.gt-idle b{position:absolute;top:50%;transform:translate(-50%,-50%);padding:0 4px;border-radius:2px;background:var(--paper);font-family:var(--f-num);font-size:11px;font-weight:600;line-height:1.35;color:var(--ink-3);white-space:nowrap;animation:fade-in .4s ease both}
/* 置く前の見込み（PC でカードに触れたとき）: 置いたら入る場所を点線で */
.gb-ghost{position:absolute;height:calc(var(--rh) - 8px);border:1.8px dashed var(--ink-2);border-radius:2px;background:repeating-linear-gradient(-45deg,var(--line-3) 0 3px,transparent 3px 7px);z-index:2;pointer-events:none;animation:fade-in .18s ease both}
/* 完成の演出: 時刻の針が0から完成まで走る */
.gt-sweep{position:absolute;top:-17px;bottom:0;left:0;width:0;border-left:2px solid var(--red);z-index:6;pointer-events:none;animation:sweep .7s cubic-bezier(.45,.05,.55,.95) forwards}
.gt-sweep::before{content:"";position:absolute;top:0;left:-6px;border:5px solid transparent;border-top:7px solid var(--red)}
@keyframes sweep{0%{left:0;opacity:1}85%{opacity:1}100%{left:var(--to);opacity:0}}
.gt-unit{height:19px;font-family:var(--f-num);font-size:11px;font-weight:600;color:var(--ink-3);text-align:center;padding-top:2px}
.gt-axis{position:relative;height:19px}
.gt-axis span{position:absolute;top:2px;transform:translateX(-50%);font-family:var(--f-num);font-size:11px;font-weight:600;color:var(--ink-3);transition:left .35s var(--ease)}
.gt-axis span:first-child{transform:none}
.gt-axis span.end{transform:translateX(-100%)}
.chart-cap{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 6px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.chart-cap b{font-family:var(--f-num);font-size:16px;color:var(--ink)}

/* 予想 */
.guess{position:relative;margin:0 0 12px;padding:14px 14px 14px;background:var(--paper);border:1.6px solid var(--acc);border-radius:3px;box-shadow:var(--sh-1);animation:view-in .35s var(--ease) both}
.guess-q{margin:0;font-family:var(--f-disp);font-weight:400;font-size:18px;letter-spacing:.04em}
.guess-q small{display:block;font-family:var(--f-body);font-size:12.5px;font-weight:400;color:var(--ink-3);letter-spacing:0;margin-top:2px}
.guess-val{display:flex;align-items:baseline;justify-content:center;gap:4px;margin:8px 0 2px}
.guess-val b{font-family:var(--f-num);font-weight:600;font-size:46px;line-height:1;color:var(--acc-ink);min-width:2.2ch;text-align:right}
.guess-val span{font-weight:700;color:var(--ink-2)}
.guess-val.unset b{color:var(--ink-3)}
.ruler{position:relative;height:40px;margin:2px 4px 0}
.ruler-ticks{position:absolute;left:11px;right:11px;top:22px;height:12px;pointer-events:none}
.ruler-ticks i{position:absolute;top:0;width:0;height:6px;border-left:1px solid var(--ink-3)}
.ruler-ticks i.mj{height:11px;border-left-width:1.5px;border-color:var(--ink-2)}
.guess input[type=range]{-webkit-appearance:none;appearance:none;position:absolute;inset:0 0 auto 0;width:100%;height:24px;margin:0;background:transparent;cursor:pointer}
.guess input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--acc) var(--p,50%),var(--paper-3) var(--p,50%));border:1px solid var(--line-2)}
.guess input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--paper-3);border:1px solid var(--line-2)}
.guess input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--acc)}
.guess input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-10px;border-radius:4px;background:var(--pri);border:2px solid var(--paper);box-shadow:0 0 0 1.5px var(--pri),2px 2px 0 var(--acc)}
.guess input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:4px;background:var(--pri);border:2px solid var(--paper);box-shadow:0 0 0 1.5px var(--pri)}
.guess-scale{display:flex;justify-content:space-between;gap:8px;margin:0 0 12px;font-size:12px;color:var(--ink-2)}
.guess-scale span{display:grid;line-height:1.3}
.guess-scale span:last-child{text-align:right}
.guess-scale b{font-family:var(--f-num);font-size:14px}
.guess-scale small{font-size:10.5px;color:var(--ink-3)}
.guess-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.guess-btns .btn{padding-left:6px;padding-right:6px;gap:5px;font-size:13.5px;white-space:nowrap}

/* はじめての段取りの案内（付箋） */
.guide{
  position:relative;margin:0 4px 14px;padding:12px 14px 12px 14px;background:var(--n-hand);color:var(--note-ink);border-radius:2px;
  box-shadow:var(--sh-note);transform:rotate(.4deg);background-image:linear-gradient(rgba(0,0,0,.06) 0 8px,transparent 8px)
}
.guide .g-k{display:flex;align-items:center;gap:6px;margin:2px 0 4px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--note-ink-2)}
.guide .g-k .i{width:16px;height:16px}
.guide p{margin:0;font-size:14px;line-height:1.6;font-weight:700}
.guide p.sub{font-weight:400;font-size:13px;margin-top:4px}
.guide.warn{background-color:#FFC9BC}
.guide.done{background-color:#BDEBC8}
.guide.flash{animation:guide-flash .5s var(--ease)}
@keyframes guide-flash{0%{transform:rotate(.4deg) scale(1)}40%{transform:rotate(-.6deg) scale(1.025)}100%{transform:rotate(.4deg) scale(1)}}

/* 作業カード（付箋） */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px;margin:0 0 6px;padding:2px 2px 0}
.tk{
  --tilt:-.7deg;position:relative;display:flex;flex-direction:column;align-items:stretch;gap:2px;min-height:96px;padding:12px 10px 8px;text-align:left;
  background:var(--lc);color:var(--note-ink);border:0;border-radius:2px;box-shadow:var(--sh-note);transform:rotate(var(--tilt));
  background-image:linear-gradient(rgba(0,0,0,.065) 0 7px,transparent 7px);
  transition:transform .22s var(--ease),box-shadow .22s var(--ease),background-color .25s,color .25s;
}
.tk:nth-child(2n){--tilt:.6deg}
.tk:nth-child(3n){--tilt:-.3deg}
.tk:hover{transform:rotate(0) translateY(-2px);box-shadow:0 1px 1px rgba(50,40,0,.12),0 14px 16px -10px rgba(50,40,0,.5)}
.tk:active{transform:rotate(0) translateY(1px) scale(.98);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tk-top{display:flex;align-items:center;gap:4px;min-width:0}
.tk-ic{display:inline-flex;align-items:center;gap:1px;flex:none}
.tk-ic .i{width:18px;height:18px;stroke-width:1.9}
.tk-ic .plus{font-size:11px;font-weight:700;opacity:.7;margin:0 1px}
.tk-res{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px;font-weight:700;color:var(--note-ink-2)}
.tk-dur{margin-left:auto;padding-left:4px;font-family:var(--f-num);font-weight:600;font-size:13px;white-space:nowrap}
.tk-dur b{font-size:19px;font-weight:600}
.tk-name{margin-top:2px;font-size:14px;font-weight:700;line-height:1.35;word-break:normal;overflow-wrap:anywhere}
.tk-after{font-size:11.5px;line-height:1.35;color:var(--note-ink-2)}
/* 見込み（いま置くと何分から）。半券のように点線で区切る */
.tk-eta{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 4px;margin-top:auto;padding-top:5px;border-top:1.2px dashed rgba(30,25,10,.3);font-size:11.5px;line-height:1.45;color:var(--note-ink-2)}
.tk-eta>span{white-space:nowrap}
.tk-eta b{font-family:var(--f-num);font-size:14.5px;font-weight:600;color:var(--note-ink);margin:0 1px}
.tk-eta .i{width:14px;height:14px;align-self:center;stroke-width:2.2}
.tk-eta .tk-why{flex-basis:100%;white-space:normal;font-weight:700;color:var(--note-ink-2)}
.tk-eta .tk-why.gap{color:#7E2A10}
.tk-eta .tk-need{flex:1;min-width:0;white-space:normal}
.tk-why,.steps li{word-break:keep-all;overflow-wrap:anywhere}
.tk.is-wait .tk-eta{flex-wrap:nowrap;align-items:flex-start}
.tk.is-wait .tk-eta .i{align-self:flex-start;margin-top:2px}
.tk-no{position:absolute;top:-7px;right:-6px;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--pri);color:var(--pri-ink);font-family:var(--f-num);font-weight:600;font-size:13px;box-shadow:0 0 0 2px var(--bg);animation:no-pop .4s var(--bounce) both}
@keyframes no-pop{from{transform:scale(0)}to{transform:scale(1)}}
/* 置いたカード: 付箋は工程表へ移り、跡（点線の枠と色の耳）だけが残る */
.tk.is-placed{background:transparent;background-image:none;color:var(--ink-3);box-shadow:none;transform:none;outline:1.4px dashed var(--line-2);outline-offset:-1.4px}
.tk.is-placed::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--lc);border-radius:2px 0 0 2px}
.tk.is-placed .tk-res,.tk.is-placed .tk-eta{color:var(--ink-3)}
.tk.is-placed .tk-name{color:var(--ink-2)}
.tk.is-placed .tk-eta{border-top-color:var(--line-3)}
.tk.is-placed .tk-eta b{color:var(--ink-2)}
.tk.is-placed:hover,.tk.is-placed:active{transform:none;box-shadow:none}
/* 前提待ちのカード: 付箋に斜線をかけて押せないことを示す（文字の濃さは落とさない） */
.tk.is-wait{box-shadow:none;transform:none;background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.62) 0 5px,rgba(255,255,255,.3) 5px 10px);outline:1.5px dashed rgba(30,25,10,.42);outline-offset:-1.5px}
.tk.is-wait:hover{transform:none;box-shadow:none}
.tk.is-wait .tk-eta{color:#6E1C0C;font-weight:700;border-top-color:rgba(30,25,10,.25)}
.tk:focus-visible{outline:2.5px solid var(--ink);outline-offset:3px}
.tk.unlock{animation:tk-unlock .5s var(--bounce)}
@keyframes tk-unlock{0%{transform:rotate(var(--tilt)) scale(.94)}60%{transform:rotate(var(--tilt)) scale(1.04)}100%{transform:rotate(var(--tilt)) scale(1)}}
.tk.shake{animation:tk-shake .4s ease}
@keyframes tk-shake{0%,100%{transform:rotate(var(--tilt))}20%{transform:translateX(-5px) rotate(var(--tilt))}45%{transform:translateX(5px) rotate(var(--tilt))}70%{transform:translateX(-3px) rotate(var(--tilt))}}
.tk.ping{animation:tk-ping .9s ease}
@keyframes tk-ping{0%,100%{box-shadow:var(--sh-note)}30%,60%{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--red)}}
.cards.locked .tk{opacity:.82}
.cards.locked .tk:hover{transform:rotate(var(--tilt))}
.cards.busy{pointer-events:none}

.playbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--scrim);border-top:1.4px solid var(--line-3);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:bar-in .3s var(--ease) both
}
@keyframes bar-in{from{transform:translateY(100%)}to{transform:none}}
.playbar-in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;width:100%;max-width:448px}
.playbar .btn{min-height:46px;padding:8px 10px;font-size:14.5px}
/* 真ん中: 完成の時刻と置いた枚数（カードを見ているあいだも完成が分かる） */
.pb-prog{display:grid;justify-items:center;gap:1px;min-width:62px;text-align:center;line-height:1.15}
.pb-prog .pb-ms{display:inline-flex;align-items:baseline;gap:2px;font-size:11px;font-weight:700;color:var(--ink-3)}
.pb-prog .pb-ms b{font-family:var(--f-num);font-size:19px;font-weight:600;color:var(--ink)}
.pb-prog .pb-n{font-family:var(--f-num);font-weight:600;font-size:11.5px;color:var(--ink-3)}

/* ---------- 結果 ---------- */
.pagebar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;margin:0 -16px 12px;padding:calc(6px + env(safe-area-inset-top)) 12px 6px 6px;background:var(--scrim);border-bottom:1.4px solid var(--line-3);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.pagebar h1{margin:0;flex:1;min-width:0;font-family:var(--f-disp);font-weight:400;font-size:19px;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res-hero{position:relative;margin:0 0 14px;padding:16px 16px 14px;background:var(--paper);border:1.6px solid var(--ink);border-radius:2px;box-shadow:var(--sh-1);overflow:hidden}
.res-hero::before{content:"";position:absolute;inset:5px;border:1px solid var(--line-3);pointer-events:none}
.res-case{position:relative;margin:0 0 4px;font-size:12.5px;font-weight:700;color:var(--ink-3);letter-spacing:.04em}
.res-stars{position:relative;display:flex;gap:6px;margin:4px 0 6px}
.res-stars svg{width:38px;height:38px}
.res-stars .on{fill:var(--acc);stroke:var(--ink);stroke-width:1.3}
.res-stars .off{fill:var(--paper-3);stroke:var(--ink-3);stroke-width:1.2}
.res-stars.anim svg{animation:star-in .5s var(--bounce) both}
.res-stars.anim svg:nth-child(2){animation-delay:.12s}
.res-stars.anim svg:nth-child(3){animation-delay:.24s}
@keyframes star-in{from{opacity:0;transform:scale(.2) rotate(-40deg)}to{opacity:1;transform:none}}
.res-title{position:relative;margin:0 0 10px;font-family:var(--f-disp);font-weight:400;font-size:24px;line-height:1.3;letter-spacing:.03em}
.res-title:focus{outline:none}
.res-nums{position:relative;display:grid;grid-template-columns:1fr 1fr;border:1.4px solid var(--ink)}
.res-nums>div{padding:7px 10px 8px;min-width:0}
.res-nums>div+div{border-left:1px solid var(--line-2)}
.res-nums small{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--ink-3)}
.res-nums b{font-family:var(--f-num);font-weight:600;font-size:34px;line-height:1.05}
.res-nums b em{font-style:normal;font-family:var(--f-body);font-size:14px;font-weight:700;margin-left:3px;color:var(--ink-2)}
.res-nums .best b{color:var(--ok)}
.res-nums .diff{grid-column:1/-1;border-left:0!important;border-top:1px solid var(--line-2);font-size:13px;color:var(--ink-2);padding:6px 10px}
.res-guess{position:relative;display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:12px 0 0;font-size:13px;color:var(--ink-2)}
.res-guess .gv{display:inline-flex;align-items:baseline;gap:2px;padding:2px 8px;border:1.3px solid var(--line-2);border-radius:3px;background:var(--paper)}
.res-guess .gv small{font-size:10.5px;font-weight:700;color:var(--ink-3);margin-right:3px}
.res-guess .gv b{font-family:var(--f-num);font-size:16px;color:var(--ink)}
.res-guess .gv.g{border-style:dashed;border-color:var(--acc)}
.res-guess .gv.g b{color:var(--acc-ink)}
.res-guess .gv.bst b{color:var(--ok)}
.res-guess .arr{color:var(--ink-3)}
.res-guess .grade{flex-basis:100%;font-size:12.5px}
.res-meta{position:relative;display:flex;flex-wrap:wrap;gap:4px 14px;margin:10px 0 0;font-size:13px;color:var(--ink-2)}
.res-meta b{font-family:var(--f-num)}
.res-meta .fire{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--ink)}
.res-meta .fire .i{width:17px;height:17px;color:var(--k-acc)}
.tips{
  position:relative;margin:0 4px 16px;padding:14px 14px 13px;background:var(--n-hand);color:var(--note-ink);border-radius:2px;box-shadow:var(--sh-note);
  transform:rotate(-.4deg);background-image:linear-gradient(rgba(0,0,0,.06) 0 9px,transparent 9px)
}
.tips h2{display:flex;align-items:center;gap:6px;margin:2px 0 6px;font-family:var(--f-disp);font-weight:400;font-size:17px;letter-spacing:.06em}
.tips h2 .i{width:20px;height:20px}
.tips p{margin:0;font-size:14px;line-height:1.65}
.tips p+p{margin-top:5px;font-weight:700}
.cmp{margin:0 0 14px;padding:12px 10px 10px;background:var(--paper);border:1.6px solid var(--ink);border-radius:2px;box-shadow:var(--sh-1)}
.cmp h2{margin:0 2px 10px;font-family:var(--f-disp);font-weight:400;font-size:17px;letter-spacing:.05em}
.cmp .chart-cap{margin-top:4px}
.cmp .chart-cap .lbl{display:inline-flex;align-items:center;gap:6px}
.cmp .chart-cap .sw{width:10px;height:10px;border-radius:2px;background:var(--acc);border:1px solid var(--ink)}
.cmp .chart-cap .sw.b{background:var(--ok)}
.cmp-best{overflow:hidden;transition:max-height .5s var(--ease),opacity .4s;max-height:0;opacity:0}
.cmp-best.open{max-height:960px;opacity:1}
.cmp-sep{height:0;border-top:1.4px dashed var(--line-2);margin:10px 0 10px}
.ord{width:100%;border-collapse:collapse;margin:10px 0 2px;font-size:12.5px;table-layout:fixed}
.ord th{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--ink-3);text-align:left;padding:2px 6px;border-bottom:1.4px solid var(--ink)}
.ord th:first-child,.ord td:first-child{width:30px;text-align:center;font-family:var(--f-num);font-weight:600}
.ord td{padding:5px 6px;border-bottom:1px dashed var(--line-3);vertical-align:top;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere}
.ord td .sw{display:inline-block;width:8px;height:8px;margin-right:5px;border-radius:1px;background:var(--lc);border:1px solid rgba(30,25,10,.5);vertical-align:1px}
.ord tr.split td{background:var(--red-wash);border-bottom-color:var(--red)}
.ord tr.split td:first-child{color:var(--red)}
.ord tr.after td{color:var(--ink-3)}
.ord tr.same td{color:var(--ink-2)}
.split-note{display:flex;align-items:flex-start;gap:6px;margin:8px 2px 0;font-size:12.5px;font-weight:700;color:var(--red)}
.split-note .i{width:16px;height:16px;margin-top:2px}
.res-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px;margin:0 0 12px}
.res-actions .full{grid-column:1/-1}
.res-actions .btn{padding-left:8px;padding-right:8px}
.copy-fb{margin:4px 0 12px;padding:10px;border:1.4px dashed var(--line-2);border-radius:3px;background:var(--paper)}
.copy-fb p{margin:0 0 6px;font-size:12.5px;color:var(--ink-2)}
.copy-fb textarea{width:100%;font-family:var(--f-num);font-size:13px;line-height:1.5;padding:8px;border:1.3px solid var(--line-2);border-radius:3px;background:var(--paper-2);color:var(--ink);resize:none}
.res-done-msg{position:relative;margin:4px 0 2px;font-size:14px;line-height:1.7}

/* ---------- 記録帳 ---------- */
.tally{display:grid;grid-template-columns:repeat(4,1fr);border:1.6px solid var(--ink);background:var(--paper);box-shadow:var(--sh-1);margin:0 0 8px}
.tally>div{display:grid;justify-items:center;padding:9px 2px 8px;min-width:0}
.tally>div+div{border-left:1px solid var(--line-2)}
.tally b{font-family:var(--f-num);font-weight:600;font-size:24px;line-height:1.1}
.tally span{font-size:11px;font-weight:700;color:var(--ink-3);white-space:nowrap}
.tally-note{margin:0 2px 16px;font-size:12.5px;color:var(--ink-2);line-height:1.7}
.tally-note b{font-family:var(--f-num)}
.ledger{margin:0;padding:0;list-style:none}
.lg-head h3{margin:14px 2px 6px;font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--ink-3)}
.ledger li+li:not(.lg-head){margin-top:6px}
.ledger button{
  display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:8px;width:100%;padding:8px 10px 8px 8px;text-align:left;
  background:var(--paper);border:1.4px solid var(--line-2);border-radius:2px;transition:border-color .2s,transform .16s var(--ease),background-color .2s
}
.ledger button:hover{border-color:var(--ink);transform:translateX(2px)}
.lg-no{display:grid;justify-items:center;font-family:var(--f-num);font-weight:600;font-size:18px;line-height:1;border-right:1px dashed var(--line-2);padding-right:6px}
.lg-no small{font-size:11px;color:var(--ink-3)}
.lg-mid{min-width:0;display:grid;gap:1px}
.lg-date{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3);font-weight:700;white-space:nowrap;overflow:hidden}
.lg-date .stars svg{width:11px;height:11px}
.lg-date .i{width:13px;height:13px}
.lg-today{padding:0 5px;border-radius:2px;background:var(--acc);color:#1B1405;font-size:10.5px}
.lg-title{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-end{display:grid;justify-items:end;gap:1px;font-size:11.5px;color:var(--ink-2);white-space:nowrap}
.lg-end .stars svg{width:12px;height:12px}
.lg-res{display:inline-flex;align-items:center;gap:3px}
.lg-res small{font-size:11px;font-weight:700;color:var(--ok);letter-spacing:.04em}
.lg-res .stars .on{fill:var(--ok)}
.lg-end .tnum{font-weight:600}
.lg-more{margin-top:12px}
.book-note{margin:0 2px 8px;font-size:12.5px;color:var(--ink-3)}

/* ---------- 遊び方・設定 ---------- */
.page{padding:0 2px}
.page h2{margin:24px 0 8px;font-family:var(--f-disp);font-weight:400;font-size:18px;letter-spacing:.06em;display:flex;align-items:center;gap:8px}
.page h2::before{content:"";width:14px;height:14px;border:2px solid var(--acc);border-radius:2px;transform:rotate(45deg) scale(.75)}
.page p{margin:0 0 10px;font-size:14.5px}
.page-lead{font-size:15px!important}
.rules{margin:0 0 6px;padding:0;list-style:none;counter-reset:r}
.rules li{position:relative;display:grid;grid-template-columns:28px 1fr;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line-3);font-size:14px;line-height:1.6}
.rules li::before{counter-increment:r;content:counter(r);display:grid;place-items:center;width:24px;height:24px;margin-top:1px;border:1.6px solid var(--ink);border-radius:50%;font-family:var(--f-num);font-weight:600;font-size:12px}
.legend{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 10px;margin:0 0 8px}
.legend div{display:flex;align-items:center;gap:7px;font-size:13px;padding:5px 7px;border:1px solid var(--line-3);border-radius:2px;background:var(--paper)}
.legend .sw{display:inline-grid;place-items:center;width:28px;height:24px;flex:none;border-radius:2px;background:var(--lc);color:var(--note-ink)}
.legend .sw .i{width:17px;height:17px}
.legend small{display:block;font-size:11px;color:var(--ink-3);line-height:1.3;word-break:keep-all;overflow-wrap:anywhere}
.ex-tasks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 12px}
.ex-tasks div{padding:7px 8px 6px;background:var(--lc);color:var(--note-ink);border-radius:2px;box-shadow:var(--sh-note);font-size:12.5px;font-weight:700;line-height:1.35;background-image:linear-gradient(rgba(0,0,0,.06) 0 5px,transparent 5px)}
.ex-tasks div small{display:block;font-weight:400;font-size:11px;color:var(--note-ink-2)}
.ex-tasks div .tnum{float:right;font-weight:600}
.ex-box{margin:0 0 12px;padding:10px 10px 8px;background:var(--paper);border:1.6px solid var(--ink);border-radius:2px}
.ex-box+.ex-box{margin-top:-2px}
.ht-tut{margin:14px 0 4px;padding:14px;border:1.6px dashed var(--line-2);border-radius:3px;background:var(--paper)}
.ht-tut .ht-k{margin:0 0 2px;font-weight:700}
.ht-tut .ht-d{font-size:13px!important;color:var(--ink-2)}
.ht-row{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}
.week{width:100%;border-collapse:collapse;margin:4px 0 10px;font-size:13.5px;background:var(--paper)}
.week th,.week td{border:1px solid var(--line-2);padding:6px 8px;text-align:left}
.week th{font-size:11.5px;letter-spacing:.08em;color:var(--ink-3);background:var(--paper-2)}
.week td .i{width:16px;height:16px;color:var(--acc-ink);vertical-align:-3px}
.settings{margin:0 0 18px;padding:0;list-style:none;border:1.6px solid var(--ink);background:var(--paper);box-shadow:var(--sh-1)}
.settings li{display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px dashed var(--line-2)}
.settings li:last-child{border-bottom:0}
.settings li>.i{color:var(--line)}
.settings b{display:block;font-size:15px}
.settings small{display:block;font-size:12px;color:var(--ink-3);line-height:1.45}
.settings .seg{grid-column:1/-1;justify-self:stretch;display:grid;grid-template-columns:repeat(3,1fr)}
.settings .seg button{justify-content:center}
.switch{position:relative;width:52px;height:30px;border-radius:999px;border:1.6px solid var(--ink);background:var(--paper-3);transition:background-color .25s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:var(--paper);border:1.5px solid var(--ink);transition:transform .25s var(--bounce)}
.switch[aria-checked="true"]{background:var(--pri)}
.switch[aria-checked="true"]::after{transform:translateX(21px)}
.danger-zone{margin:0 0 16px}
.confirm{padding:14px;border:1.8px solid var(--red);border-radius:3px;background:var(--red-wash)}
.confirm p{margin:0 0 12px;font-size:14px}
.confirm .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.about{font-size:12.5px;color:var(--ink-3);line-height:1.8}
.about-link{display:inline-flex;align-items:center;gap:6px;margin-top:8px;color:var(--ink-2);font-weight:700;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px;transition:color .18s ease,text-decoration-color .18s ease}
.about-link .i{width:16px;height:16px}
.about-link:hover,.about-link:focus-visible{color:var(--acc-ink);text-decoration-color:currentColor}
/* 設定: 毎朝の通知（iOS アプリのときだけ出す） */
.set-sub{grid-column:2 / -1;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;color:var(--ink-2);animation:view-in .3s var(--ease) both}
.set-sub input[type="time"]{font-family:var(--f-num);font-size:16px;font-weight:600;color:var(--ink);background:var(--paper-2);border:1.4px solid var(--ink);border-radius:3px;padding:4px 10px;min-height:40px}
.set-note{grid-column:2 / -1;margin:0;font-size:12.5px;line-height:1.5;color:var(--red)}

.toast{
  position:fixed;left:50%;bottom:calc(94px + env(safe-area-inset-bottom));z-index:60;width:max-content;max-width:min(420px,calc(100vw - 32px));
  padding:10px 16px;border-radius:3px;background:var(--pri);color:var(--pri-ink);font-size:14px;font-weight:700;box-shadow:3px 3px 0 var(--acc),var(--sh-1);
  opacity:0;transform:translate(-50%,12px);transition:opacity .25s,transform .3s var(--ease);pointer-events:none;text-align:center
}
.toast.show{opacity:1;transform:translate(-50%,0)}

.loading{display:grid;place-items:center;gap:10px;min-height:46vh;color:var(--ink-3);font-size:14px;text-align:center}
.ld-bars{display:grid;gap:6px;width:120px}
.ld-bars i{display:block;height:9px;border-radius:2px;background:var(--n-hand);border:1px solid rgba(30,25,10,.4);transform-origin:left;animation:ld 1.2s var(--ease) infinite}
.ld-bars i:nth-child(2){margin-left:24px;width:70%;background:var(--n-stove);animation-delay:.15s}
.ld-bars i:nth-child(3){margin-left:48px;width:55%;background:var(--n-rice);animation-delay:.3s}
@keyframes ld{0%{transform:scaleX(0)}50%{transform:scaleX(1)}100%{transform:scaleX(1);opacity:0}}

.tk-no.still{animation:none}
.res-meta>span{display:inline-flex;align-items:center;gap:4px}
.res-meta .i{width:16px;height:16px;color:var(--ink-3)}
button.hn{cursor:pointer;font:inherit}
button.hn:hover{border-color:var(--ink)}
#chGuess:empty{display:none}
.story,p,li,.toast,.tk-why,.tk-need,.tk-after{text-wrap:pretty}

}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

<script>
// ==ENGINE START==
/* 段取り名人 — 段取りエンジン（VERSION 4）
 * 問題の生成（台所・現場）・時刻の決まり（schedule）・最短の総当たり（solve）・「ここがコツ」の文（explain）・
 * はじめての段取り（tutorial）・遊び方の例題（example）・日替わり（daily / dailyConfig）・結果の★（grade）。
 * 外部への通信なし。乱数は seed から決まる mulberry32 だけを使う（Math.random は使わない）。
 * 生成は試行の回数で打ち切る（時間では打ち切らない）ので、端末の速さで問題が変わらない。
 * DOM・window・localStorage を使わないので、Web Worker の中でもそのまま動く。
 *
 * 使い方（戻り値はどれも JSON にできる素のオブジェクト。返した問題を書き換えても、エンジンには影響しない）
 *   Engine.generate({ seed, star, theme })   練習の問題。star 1〜3（範囲外は丸める）、theme 'kitchen' | 'site'（ほかは kitchen）
 *                                           seed は数か文字列（NaN・Infinity は文字列 'NaN' などにして使う）
 *   Engine.daily('YYYY-MM-DD')              今日の段取り。no / date / weekday / weekdayLabel が付く
 *   Engine.dailyConfig('YYYY-MM-DD')        { no, seed, star, theme, weekday, weekdayLabel, date, menu, title }（問題を作らずに分かる）
 *                                           no は 2026-10-19 = 1 の通し番号。それより前の日付は 0 以下（No.1 に丸めるのは画面の DAYRULES）
 *   Engine.WEEK                             曜日（0 = 日曜）→ [★, テーマ]。遊び方の曜日の表はこれから作る
 *   Engine.schedule(pz, order)              置いた順（途中でもよい）の日程 { tasks:[{i,start,end,lanes:[laneId]}], makespan, idle:{laneId:[[from,to]...]}, skipped }
 *                                           待つだけの作業の lanes は ['wait']。idle は 0〜makespan の空き時間（待つだけのレーンは無い）
 *                                           範囲外・重複・前提より先の番号は skipped に入れて飛ばす
 *   Engine.canPlace(pz, placedOrder, i)     { ok, waitingFor:[まだ置いていない前提の番号] }（置き済みなら placed:true）
 *   Engine.solve(pz)                        { best, bestOrder, countBest, countAll, near, topDown, lpt, idleFirst, cp, est, smart, orders:{...} }
 *                                           lpt・idleFirst・cp・est = よく知られたコツの完成時刻（同点の選び方を全部ためした最小）
 *   Engine.explain(pz, playerOrder)         { tips:[1〜2文], diffAt:位置|null, diffTask, bestTask, bestOrder, order, move, chain, reason, kind, best, playerMakespan }
 *                                           order = 使った順番（範囲外・重複・前提より先の番号を飛ばしたもの。diffAt はこの中の位置）
 *                                           diffAt = 最短に届く並べ方から最初に外れた位置（0 始まり）。最短なら null
 *                                           move = 勧めた直し方（1枚だけ動かした順番 order と、その完成時刻 makespan）。無ければ null
 *                                           bestOrder = あなたの順番の頭（外れるまで）を引き継いだ最短の並べ方。chain = その日程で完成を決める流れ
 *   Engine.grade(pz, ms)                    結果の★（3 = 最短、2 = 最短 + solution.near 以内、1 = それより遅い）
 *   Engine.near(best)                       ★2 になる差（最短の1割を四捨五入。少なくとも1）。保存した最短だけから★を出すときに使う
 *   Engine.tutorial(1〜3) / Engine.example() はじめての段取り（lesson に案内の文）・遊び方の例題
 * 問題（Puzzle）: { v, seed, star, target, theme, unit, menu, title, story, parts, lanes:[{id,type,name,icon}],
 *   tasks:[{name,dur,needs:[type],after:[番号],icon,hot?}], solution:{best,bestOrder,countBest,countAll,near}, stats:{...} }
 *   tasks は画面に出す順（上から順）。lanes は資源のレーン。待つだけの作業がある問題には {id:'wait',type:'wait'} のレーンが最後に付く

  /* ===================== 問題の決まり ===================== */
  // ★ごとの形。n = 作業の数、types = 資源の種類の数（待つだけは数えない）、dual = 2資源同時の作業の数
  // ★3 は「同じ種類が2つ（dup）」か「2資源同時の作業」の少なくとも一方がある

    1: { n: [4, 5], types: [2, 3], dual: [0, 0], dup: false },

  //  ratio = 最短の並べ方の数 / 前提を満たす並べ方の総数 の上限（適当に並べても届かない）。
  //    ★1 は作業が4〜5個しかなく、並べ方の総数が数通り〜数十通りなので、★2・★3 と同じ 0.2 にはできない
  //    （資源の違う作業どうしは入れ替えても同じ日程になる）。★1 は ratio[1] まで（#0003 で 0.5 → 0.4 に下げた）。
  //    さらに目安 ratioGoal[1] 以下の問題を優先して探す（台所★1は約9割、現場★1は約半分が目安以下）
  //  topGap = 「上から順」に置いたときの完成時刻が、最短より何以上遅いか

  //    lpt = 長い作業から先に、idle = 放置できる作業（自分＝手・職人を使わない作業）から先に、cp = 後に続く流れが長い作業から先に、
  //    est = いちばん早く始められる作業から（同じなら後に続く流れが長いほう）
  //  softTricks = できれば通じないようにしたいコツ（softTries 回までは、通じない問題を優先して探す。ratioGoal も同じ扱い）
  //  smartMax = stats.smart（いちばん早く始められる作業を選んでいくだけで最短に届く確率）がこれ未満であること（VERSION 4。
  //    ★2 が「空いたらすぐ置く」だけで半分以上解けないように。★3 は 1/3 の問題を出さない＝同じ週の★2 よりやさしくしない）。
  //    smartMaxLoose = 日替わりに出さない献立（お弁当）の★3 の上限（ご飯を先に炊くだけの形で、smart が 1/3 より下がらないため）
  //    smartGoal = できればこれ以下（softTries 回までは優先して探す。同じ目安なら smart が小さいほう）、smartFloor = できればこれ以上（★2 が★3 より難しくならないように）
  //  hotSlack = できたての作業（部品表の H）は、完成の hotSlack 割より前に終わってはいけない（どれか1つの最短の段取りで守れればよい）
  // ★の難しさの物差しは stats.smart（いちばん早く始められる作業を選んでいくだけで最短に届く確率）。tricks・softTricks で ★3 ほど小さくなる。
  // tools/check-engine.mjs が、平均が ★1 > ★2 > ★3 になっていること（台所・現場それぞれ）を確かめる
  const RULES = {
    ratio: { 1: 0.4, 2: 0.2, 3: 0.2 },
    ratioGoal: { 1: 0.34 },
    topGap: 3,

    tries: 600,     // 部品の組み方を試す回数（届かなければ、別の乱数でもう一度。練習ならそのあと別の献立・題材で）

  const WD = ['日', '月', '火', '水', '木', '金', '土'];

  /* ===================== 部品表の読み込み ===================== */
  function parseStep(str, prefix) {
    const p = str.split('|');
    const r = p[2].split('-').map(Number);
    const g = p[5] ? String(p[5]) : '';
    return {
      k: prefix + p[0], name: p[1], lo: r[0], hi: r.length > 1 ? r[1] : r[0],
      needs: (p[3] || '').split('').map((c) => LETTER[c]),
      after: p[4] ? p[4].split(',').map((a) => (a === '*' ? '*' : prefix + a)) : [],
      gs: g ? g.split('+').map((x) => prefix + x) : [],
      hot: (p[6] || '').indexOf('H') >= 0,
    };
  }
  // テンプレート = { id, theme, title, story, steps:[{k,name,lo,hi,needs,after,gs}], opt:[グループ名], alt:{base:[variant...]}, parts }
  function finishTemplate(T) {
    const opt = [], alt = {};
    for (const s of T.steps) {
      for (const g of s.gs) {
        const c = g.indexOf(':');
        if (c < 0) { if (opt.indexOf(g) < 0) opt.push(g); } else {
          const b = g.slice(0, c), v = g.slice(c + 1);
          alt[b] = alt[b] || [];
          if (alt[b].indexOf(v) < 0) alt[b].push(v);
        }
      }
    }
    T.opt = opt; T.alt = alt; T.altKeys = Object.keys(alt);
    // グループを分解しておく（keptBy を速くする）: [名前, 形（'x:a' の a。ふつうのグループは null）]
    for (const st of T.steps) st.gp = st.gs.map((g) => { const c = g.indexOf(':'); return c < 0 ? [g, null] : [g.slice(0, c), g.slice(c + 1)]; });
    return T;
  }
  const TEMPLATES = [];
  for (const M of MENUS) {
    const steps = [];
    const parts = [];
    for (const dd of M.d) {
      const optional = dd.endsWith('?');
      const key = optional ? dd.slice(0, -1) : dd;
      const D = DISH[key];
      if (!D) throw new Error('unknown dish ' + key);
      parts.push({ key, name: D.name, g: optional ? 'dish-' + key : null });
      for (const str of D.s) {
        const s = parseStep(str, key + '.');
        if (optional) s.gs.unshift('dish-' + key);
        steps.push(s);
      }
    }

  /* ===================== 入口 ===================== */
  function normStar(star) {

  /* ===================== 日付と日替わり ===================== */
  function parseDate(str) {

   * No.1 から順に決めるので No. に比例して重い。NO_CAP（約30年）より先は、日付の hash だけで選ぶ（時計が大きくずれた端末で固まらない） */
  const NO_CAP = 10958;

  function cfgOfNo(no) { const wd = new Date(T1 + (no - 1) * 86400000).getUTCDay(); return { wd, star: WEEK[wd][0], theme: WEEK[wd][1] }; }
  function tplForNo(no) {
    if (no > NO_CAP) { const c = cfgOfNo(no), L = templatesFor(c.theme, c.star, true); return L[hash32('dandori-menu-' + no) % L.length]; }
    while (sched.length < no) {

      // 7日以内に使ったものは外す（★の違う日にも同じ献立・題材が使えるので、念のため）
      const fresh = elig.filter((x) => n - lastUsed[x] >= 7);
      const pool = fresh.length ? fresh : elig;
      const pick = pool[hash32('dandori-menu-' + n) % Math.min(3, pool.length)];

  function dailyConfig(dateStr) {

    const weekday = new Date(pd.t).getUTCDay();
    const [star, theme] = WEEK[weekday];
    const ymd = String(dateStr).replace(/-/g, '');
    let ti;
    if (no >= 1) ti = tplForNo(no);

  /* ===================== 画面から呼ぶもの ===================== */
  function schedule(pz, order) {

      const gaps = [];
      let t = 0;
      for (const [s, e] of busy) { if (s > t) gaps.push([t, s]); if (e > t) t = e; }

  /* ===================== ここがコツ =====================

  const q = (s) => '「' + s + '」';

  function chainsOf(P, order, d) {

      if (out.length >= 64) return;

      if (d.start[j] === 0) { out.push({ chain, kinds }); return; }
      for (const p of P.predList[j]) if (d.end[p] === d.start[j]) walk([p].concat(chain), ['pred'].concat(kinds));

  function pickChain(P, order, d, prefer) {

      const sc = (prefer != null && c.chain.indexOf(prefer) >= 0 ? 1000 : 0) - lane * 20 + c.chain.length;

  // 流れの文。前提でつながる所は「→」、同じ資源が空くのを待ってつながる所は「→（コンロが空いてから）」。長すぎるときは頭と終わりだけを書く

    if (chain.length === 1) return '完成を決めるのは' + q(T[chain[0]].name) + 'の' + best + u + '。';
    const longForm = '完成を決めるのは' + q(T[chain[0]].name) + 'から' + q(T[chain[chain.length - 1]].name) + 'まで、' + chain.length + 'つの作業がすき間なくつながる流れ（' + best + u + '）。';
    if (chain.length > 4) return longForm;

  // あなたの日程で、作業 x の開始を決めたレーン（x より先に置いた作業が、x の始まる時刻まで使っていたレーン）と、その作業

   *  3) あなたの段取りでも b を a より先に置いている
   * いくつかあれば、上から順で早く分かれるもの（a が上）・動かす幅が小さいものを選ぶ。無ければ null（ほかの決め手の文にする） */

    let main, sub = '', kind = '';

      main = L.intro; sub = L.tip;

      // 最短に届く続きがあるか（diffAt が null）だけを使う。explain の文は答えを言うので、ここでは出さない
      const ex = Engine.explain(pz, P.order);
      if (ex.diffAt == null) { main = 'いい流れ。あと' + left + '枚。'; sub = L.on || ''; }
      else { main = L.hint || '並べ方を見直してみよう。'; sub = 'このままだと最短の' + pz.solution.best + u + 'には届かない。［1つ戻す］で置き直せる（このまま最後まで置いてもいい）。'; kind = 'warn'; }

  function wipe() {
    update((s) => {

      d.settings = keep;
      d.epoch = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);   // ほかのタブの段取りが書き戻さないように
      Object.keys(s).forEach((k) => { delete s[k]; });

  /* ---------- 操作 ---------- */
  document.addEventListener('click', (e) => {
    if (!booted) return;   // iOS アプリで記録を戻している間（最長1.2秒）は押せない
    if (cur === 'play' && P && P.finished && e.target.closest && e.target.closest('#sheet')) { toResult(); return; }
    const t = e.target.closest ? e.target.closest('button, [data-nav]') : null;
    if (!t) return;
    if (t.dataset.nav) { go(t.dataset.nav); return; }
    if (t.matches('#cards .tk')) { place(+t.dataset.i); return; }
    if (t.dataset.pending) { openDaily(t.dataset.pending); return; }
    if (t.dataset.day) { openDaily(t.dataset.day); return; }
    if (t.dataset.star) { openPractice(+t.dataset.star, false); return; }
    if (t.dataset.ptheme) { update((s) => { s.settings.pracTheme = t.dataset.ptheme; }); renderPractice(); sfx('tick'); return; }
    if (t.dataset.set === 'notifyMorning') { toggleNotify(); return; }
    if (t.dataset.set) {
      const k = t.dataset.set;
      update((s) => { s.settings[k] = !s.settings[k]; });
      renderSettings();
      const f = $('[data-set="' + k + '"]'); if (f) f.focus();   // 作り直したあとも、押したスイッチに焦点を残す
      if (k === 'haptics') buzz('toggle');
      if (k === 'sound') sfx('tick');
      return;
    }
    if (t.dataset.themeSet) { update((s) => { s.settings.theme = t.dataset.themeSet; }); applyTheme(); renderSettings(); return; }
    switch (t.id) {
      case 'tOpen': openDaily(today()); break;
      case 'tutGo': openTutorial(tutNext()); break;
      case 'tutX': update((s) => { s.tutorial.dismissed = true; }); renderTutCard(); toast('はじめての段取りは「遊び方」からも始められます'); break;
      case 'howTut': openTutorial(S.tutorial.done >= 3 ? 1 : tutNext()); break;
      case 'playBack': goBack(); break;
      case 'resBack': go('home'); break;
      case 'guessGo': startGuess(true); break;
      case 'guessSkip': startGuess(false); break;
      case 'btnUndo': undo(); break;
      case 'btnReset': resetOrder(); break;
      case 'btnAgain': again(); break;
      case 'btnCopy': doCopy(); break;
      case 'btnHome': go('home'); break;
      case 'btnNext': openPractice(P ? P.star : 1, true); break;
      case 'btnNextTut': openTutorial((P ? P.ep : 0) + 1); break;
      case 'btnToToday': openDaily(today()); break;
      case 'bookMore': bookMore(); break;
      case 'wipeAsk': confirmOpen = true; renderSettings(); { const y = $('#wipeNo'); if (y) y.focus(); } break;
      case 'wipeNo': confirmOpen = false; renderSettings(); break;
      case 'wipeYes': wipe(); break;
      default: break;
    }
  });
  document.addEventListener('input', (e) => { if (e.target && e.target.id === 'guessIn') markGuess(e.target); });
  document.addEventListener('change', (e) => { if (e.target && e.target.id === 'guessIn') markGuess(e.target); });
  // 動かさずにつまみを押しただけでも、その値を選べる（スクロールで指が離れたときは pointercancel になり、ここには来ない）
  document.addEventListener('pointerup', (e) => { if (e.target && e.target.id === 'guessIn') markGuess(e.target); });
  // 置く前の見込み: マウスで触れた・キーボードで選んだカードの入る場所を、工程表に点線で出す（指で押すときは出さない）
  const cardAt = (el) => (el && el.closest ? el.closest('#cards .tk') : null);
  document.addEventListener('pointerover', (e) => { if (e.pointerType !== 'mouse') return; const c = cardAt(e.target); if (c && cardAt(e.relatedTarget) !== c) showGhost(+c.dataset.i); });
  document.addEventListener('pointerout', (e) => { if (e.pointerType !== 'mouse') return; const c = cardAt(e.target); if (c && cardAt(e.relatedTarget) !== c) clearGhost(); });
  document.addEventListener('focusin', (e) => { const c = cardAt(e.target); let fv = false; try { fv = c && c.matches(':focus-visible'); } catch (er) { fv = false; } if (fv) showGhost(+c.dataset.i); });
  document.addEventListener('focusout', (e) => { if (cardAt(e.target)) clearGhost(); });
  // 画面の幅が変わったら工程表を描き直す（帯の文字を出すかどうかが変わる）
  // 高さだけの変化（スマホでスクロールするとアドレスバーが出入りする）では描き直さない（開いた再生が閉じてしまうため）
  let resizeT = 0, lastW = window.innerWidth;
  window.addEventListener('resize', () => {
    if (window.innerWidth === lastW) return;
    lastW = window.innerWidth;
    clearTimeout(resizeT);
    resizeT = setTimeout(() => { if (cur === 'play' && P && $('#gantt')) { P.lastMove = null; updatePlay(true); } else if (cur === 'result') renderResult(false); else if (cur === 'howto') renderHowto(); }, 200);
  });
  // 日付が変わったら、ホーム・記録帳を描き直す
  let lastDay = today(), lastBehind = clockBehind(rawToday());
  function checkDay() {
    const d = today(), behind = clockBehind(rawToday());
    if (d === lastDay && behind === lastBehind) return;
    const changed = d !== lastDay;
    lastDay = d; lastBehind = behind;
    if (!changed) { if (cur === 'home') renderHome(); else if (cur === 'book') renderBook(); return; }   // 時計を直した・ずれた
    if (cur === 'home') { renderHome(); toast('日付が変わりました。新しい段取りが届いています'); } else if (cur === 'book') renderBook();
  }
  // アプリが裏に回ったら（ブラウザのタブ・iOS アプリ）: 途中を保存し、段取りの再生・完成の演出・音を止める。
  // 戻ったら日付を確かめ、完成の演出の途中だったら結果へ進む（iOS アプリでは App の appStateChange でも同じことをする）
  function pauseAll() {
    if (cur === 'play' && P && !P.finished) saveProgress();
    if (replayT) { stopReplay(); if (replayEnd) replayEnd(); }   // 再生は止めて、最後の形を見せておく
    if (finishT) { clearTimeout(finishT); finishT = 0; }           // 完成の演出の途中: 戻ったら結果へ
    try { if (AC && AC.state === 'running' && AC.suspend) AC.suspend().catch(() => {}); } catch (e) { /* 音の無い環境 */ }
  }
  function resumeAll() {
    checkDay();
    if (cur === 'play' && P && P.finished && !finishT) toResult();
  }
  document.addEventListener('visibilitychange', () => { if (document.hidden) pauseAll(); else resumeAll(); });
  window.addEventListener('focus', checkDay);
  setInterval(checkDay, 60000);
  // 別のタブで記録が変わったら、ホーム・記録帳・設定の表示を合わせる（遊んでいる途中の段取りには触れない）
  window.addEventListener('storage', (e) => {
    if (e.key !== KEY) return;
    const fresh = readStore();
    if (!fresh) return;
    S = fresh;
    applyTheme();
    if (cur === 'home') renderHome(); else if (cur === 'book') renderBook(); else if (cur === 'settings') renderSettings();
  });

  // 毎朝の通知の時刻を変えた（iOS アプリの設定）
  document.addEventListener('change', (e) => {
    if (!e.target || e.target.id !== 'notifyTime') return;
    const v = e.target.value;
    if (!TIME_RE.test(v)) { e.target.value = S.settings.notifyTime; return; }
    update((s) => { s.settings.notifyTime = v; });
    syncNotifications();
    toast('毎朝 ' + v + ' に知らせます');
  });

  /* ---------- 毎朝の通知（iOS アプリの LocalNotifications。端末の中だけで予約する） ----------
     決めた時刻に「今日の段取りが届きました」。その日の No.・題名・★・台所／現場を入れて、今日から NOTI_DAYS 日分を1日ずつ予約する。
     起動・アプリに戻ったとき・設定を変えたときに、このアプリの予約をまとめて取り消してから入れ直す（毎日開いていれば途切れない。NOTI_DAYS 日開かなければ止まる）。
     許可を求めるのは、設定で ON にしたときだけ（toggleNotify）。予約し直し（syncNow）では許可の状態を確かめるだけ */
  const NOTI_BASE = 810000, NOTI_SPAN = 100000;   // 通知の番号 = NOTI_BASE + 段取りの No.（このアプリの予約の見分けにも使う）
  const NOTI_DAYS = 28;
  let notiDenied = false, notiChain = Promise.resolve();
  const isMine = (id) => Number.isInteger(id) && id >= NOTI_BASE && id < NOTI_BASE + NOTI_SPAN;
  // 予約する通知の一覧。fromDay から NOTI_DAYS 日分。hm は 'HH:MM'、now（ms）より5秒以上先の時刻だけ
  function morningList(fromDay, hm, now) {
    const t = String(hm).split(':').map(Number), list = [];
    for (let i = 0; i < NOTI_DAYS; i++) {
      const d = Engine.addDays(fromDay, i), cfg = dailyOf(d);
      if (!(cfg.no >= 1) || cfg.no >= NOTI_SPAN) continue;
      const p = parseD(d), at = new Date(p.y, p.m - 1, p.d, t[0], t[1], 0);
      if (!(at.getTime() > now + 5000)) continue;
      const stars = '★'.repeat(cfg.star) + '☆'.repeat(3 - cfg.star);
      list.push({
        id: NOTI_BASE + cfg.no, title: '今日の段取りが届きました',
        body: 'No.' + cfg.no + '「' + cfg.title + '」（' + stars + '・' + THEME_NAME[cfg.theme] + '）。全部が終わる時刻を最短にしよう。',
        schedule: { at, allowWhileIdle: true }, extra: { date: d },
      });
    }
    return list;
  }
  function syncNotifications() {
    const ln = plug('LocalNotifications');
    if (!ln) return Promise.resolve();
    notiChain = notiChain.then(() => syncNow(ln), () => syncNow(ln));
    return notiChain;
  }
  async function syncNow(ln) {
    try {
      // まず、このアプリが前に予約した分をすべて取り消す
      let ids = [];
      try {
        const pend = await ln.getPending();
        ids = ((pend && pend.notifications) || []).map((n) => Number(n.id)).filter(isMine);
      } catch (e) {
        const no = dailyOf(today()).no;
        for (let k = -3; k <= NOTI_DAYS + 3; k++) if (no + k > 0) ids.push(NOTI_BASE + no + k);
      }
      if (ids.length) await ln.cancel({ notifications: ids.map((id) => ({ id })) });
      const st = S.settings, was = notiDenied;
      let perm = null;
      try { perm = await ln.checkPermissions(); } catch (e) { perm = null; }
      const granted = !!perm && perm.display === 'granted';
      // 「許可されていません」の注記: 許可されたら消す（iPhone の設定で許可して戻ってきたときなど）。ON なのに許可が無いときだけ出す
      if (granted) notiDenied = false; else if (st.notifyMorning) notiDenied = true;
      if (was !== notiDenied && cur === 'settings') renderSettings();
      if (!st.notifyMorning || !granted) return;
      const list = morningList(today(), st.notifyTime, Date.now());
      if (list.length) await ln.schedule({ notifications: list });
    } catch (e) { /* 予約できなくても遊べる */ }
  }
  // 設定の「毎朝の通知」: ON にしたときだけ許可を求める。許可されなければ OFF のまま
  async function toggleNotify() {
    const on = !S.settings.notifyMorning;
    const ln = plug('LocalNotifications');
    const refocus = () => { const f = $('[data-set="notifyMorning"]'); if (f) f.focus(); };
    if (on && ln) {
      let ok = false;
      try {
        let p = await ln.checkPermissions();
        if (!p || p.display !== 'granted') p = await ln.requestPermissions();
        ok = !!p && p.display === 'granted';
      } catch (e) { ok = false; }
      notiDenied = !ok;
      if (!ok) { if (cur === 'settings') { renderSettings(); refocus(); } toast('通知が許可されていません'); return; }
    }
    update((s) => { s.settings.notifyMorning = on; });
    if (cur === 'settings') { renderSettings(); refocus(); }
    syncNotifications();
    if (on) toast('毎朝 ' + S.settings.notifyTime + ' に知らせます');
  }
  // 通知を押してアプリを開いたら、今日の段取りを開く（起動前に届いたものは起動後に）
  let pendingOpen = false;
  function openFromNotice() {
    if (!booted) { pendingOpen = true; return; }
    if (cur === 'play' && P && P.mode === 'daily' && P.date === today()) return;
    openDaily(today());
  }
  if (plug('LocalNotifications') && typeof plug('LocalNotifications').addListener === 'function') {
    try {
      quiet(plug('LocalNotifications').addListener('localNotificationActionPerformed', (a) => {
        const id = a && a.notification ? Number(a.notification.id) : NaN;
        if (isMine(id)) openFromNotice();
      }));
    } catch (e) { /* 無くてもよい */ }
  }
  // iOS アプリが裏に回ったら止めて保存。戻ったら日付を確かめ、状態バーの色を当て直し、通知を予約し直す
  if (plug('App') && typeof plug('App').addListener === 'function') {
    try {
      quiet(plug('App').addListener('appStateChange', (st) => {
        if (st && st.isActive === false) { pauseAll(); return; }
        resumeAll();
        applyTheme();
        syncNotifications();
      }));
    } catch (e) { /* 無ければ visibilitychange だけで止める */ }
  }

  /* ---------- オフライン（Service Worker） ---------- */
  // GitHub Pages などで直接開いたときだけ登録する。登録しないのは:
  //   iOS アプリの中（NATIVE）／Claude Artifact のような iframe・sandbox の中（FRAMED）／http(s) 以外（file: など）／
  //   安全でない接続（https でも localhost でもない）／Service Worker の無いブラウザ
  // 画面の表示が終わってから（load のあと）登録し、失敗しても何もしない（アプリはそのまま動く）
  function registerSW() {
    try {
      if (NATIVE || FRAMED) return;
      if (!/^https?:$/.test(location.protocol) || !window.isSecureContext) return;
      if (!('serviceWorker' in navigator)) return;
      const go = () => { try { quiet(navigator.serviceWorker.register('sw.js')); } catch (e) { /* 何もしない */ } };
      if (document.readyState === 'complete') go();
      else window.addEventListener('load', go, { once: true });
    } catch (e) { /* 何もしない */ }
  }

  /* ---------- 起動 ---------- */
  // 記録が空なら既定の形を保存しておく。iOS アプリで Preferences を読み終える前（restoring）は書かない
  function persistIfEmpty() {
    if (restoring) return;
    let raw = null; try { raw = localStorage.getItem(KEY); } catch (e) { storeOK = false; return; }
    if (!raw && !newerStore) persist();
  }
  function boot() {
    if (booted) return;
    booted = true;
    applyTheme();
    persistIfEmpty();
    show('home');
    if (NATIVE) syncNotifications();
    // iOS アプリ: 画面が出た直後に StatusBar が既定の色に戻すことがあるので、少し後にもう一度当てる
    if (plug('StatusBar')) setTimeout(applyTheme, 900);
    if (pendingOpen) { pendingOpen = false; openFromNotice(); }
    registerSW();   // オフライン用（iOS アプリ・Artifact などでは何もしない）
  }
  if (plug('Preferences')) {
    // iOS アプリ: Preferences から記録を戻してから始める（長くても1.2秒で始める。戻すのが遅れたら、戻ったときに描き直す）
    const t0 = setTimeout(boot, 1200);
    nativeRestore().then((changed) => {
      clearTimeout(t0);
      if (!booted) { boot(); return; }
      persistIfEmpty();
      if (changed) {
        applyTheme();
        if (cur === 'home') renderHome(); else if (cur === 'book') renderBook(); else if (cur === 'settings') renderSettings();
        syncNotifications();
      }
    }, () => { clearTimeout(t0); if (!booted) boot(); else persistIfEmpty(); });
  } else boot();
})();
</script>
</body>
</html>
